name: Sito e catalogo

# Rigenera il catalogo da GitHub e pubblica la versione web su GitHub Pages.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Catalogo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site
          node tools/build-catalog.mjs --out site/catalog.json || cp catalog/catalog.json site/catalog.json
      - name: Sito
        run: |
          mkdir -p site
          cp -r web/. site/
          [ -f site/catalog.json ] || cp catalog/catalog.json site/catalog.json
          version=$(grep '^versionName=' version.properties | cut -d= -f2)
          echo "{\"version\":\"$version\"}" > site/version.json
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
